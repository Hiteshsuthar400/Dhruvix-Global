<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop — Dhruvix Global</title>
  <meta name="description" content="Shop — Dhruvix Global" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/index.html">Dhruvix Global</a>
      <nav class="main-nav">
        <a href="/index.html">Home</a>
        <a href="/shop.html">Shop</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="/pages/cart.html">Cart</a>
      </nav>
      <div class="actions">
        <button id="cart-btn">Cart (<span id="cart-count">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container products">
    <h1>Shop</h1>
    <p>Browse our products and add them to your cart.</p>

    <div class="grid">
      <article class="card">
        <img src="/assets/images/products/product-1.jpg" alt="Product 1">
        <h3>Product 1</h3>
        <p class="price">$29.99</p>
        <button class="add-btn" data-name="Product 1" data-price="29.99">Add to cart</button>
      </article>

      <article class="card">
        <img src="/assets/images/products/product-2.jpg" alt="Product 2">
        <h3>Product 2</h3>
        <p class="price">$49.99</p>
        <button class="add-btn" data-name="Product 2" data-price="49.99">Add to cart</button>
      </article>

      <article class="card">
        <img src="/assets/images/products/product-3.jpg" alt="Product 3">
        <h3>Product 3</h3>
        <p class="price">$15.99</p>
        <button class="add-btn" data-name="Product 3" data-price="15.99">Add to cart</button>
      </article>

      <article class="card">
        <img src="/assets/images/products/product-4.jpg" alt="Product 4">
        <h3>Product 4</h3>
        <p class="price">$99.00</p>
        <button class="add-btn" data-name="Product 4" data-price="99.00">Add to cart</button>
      </article>

      <article class="card">
        <img src="/assets/images/products/product-5.jpg" alt="Product 5">
        <h3>Product 5</h3>
        <p class="price">$9.99</p>
        <button class="add-btn" data-name="Product 5" data-price="9.99">Add to cart</button>
      </article>

      <article class="card">
        <img src="/assets/images/products/product-6.jpg" alt="Product 6">
        <h3>Product 6</h3>
        <p class="price">$199.00</p>
        <button class="add-btn" data-name="Product 6" data-price="199.00">Add to cart</button>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© Dhruvix Global — All rights reserved.</p>
    </div>
  </footer>

  <script src="/assets/script.js"></script>
</body>
</html>
